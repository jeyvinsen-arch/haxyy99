<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haxyy99</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .header { background: #21262d; padding: 12px 16px; border-bottom: 1px solid #30363d; }
  .header h1 { font-size: 15px; color: #58a6ff; font-weight: 600; }
  .header h1 span { font-size: 11px; color: #8b949e; font-weight: 400; }
  .tabs { display: flex; background: #0d1117; border-bottom: 1px solid #30363d; }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 13px; color: #8b949e; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 600; }
  .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; background: #161b22; }
  .content { flex: 1; overflow-y: auto; display: none; flex-direction: column; }
  .content.active { display: flex; }
  .chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #1f6feb; color: #fff; }
  .msg.ai { align-self: flex-start; background: #21262d; border: 1px solid #30363d; }
  .msg.ai.typing::after { content: '▋'; animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .input-area { padding: 10px; background: #0d1117; border-top: 1px solid #30363d; display: flex; gap: 8px; }
  input, textarea { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; font-size: 14px; outline: none; font-family: inherit; }
  input:focus { border-color: #58a6ff; }
  button { padding: 12px 16px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: #238636; color: #fff; }
  button:active { background: #2ea043; }
  .scan-area { padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; flex: 1; text-align: center; }
  .scan-area .icon { font-size: 70px; }
  .scan-area p { font-size: 14px; color: #8b949e; line-height: 1.6; }
  .scan-area b { color: #e6edf3; }
  .btn-full { width: 100%; padding: 16px; font-size: 15px; }
  .preview { width: 100%; max-height: 200px; border-radius: 12px; border: 1px solid #30363d; display: none; object-fit: contain; background: #000; }
  .settings { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .setting-group { background: #21262d; padding: 14px; border-radius: 12px; border: 1px solid #30363d; }
  .setting-group label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
  .setting-group select, .setting-group input { width: 100%; }
  .status { padding: 8px 16px; background: #0d1117; border-top: 1px solid #30363d; font-size: 11px; color: #8b949e; display: flex; justify-content: space-between; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6e7681; display: inline-block; margin-right: 6px; }
  .dot.on { background: #3fb950; }
  .dot.rec { background: #f85149; animation: blink 1s infinite; }
</style>
</head>
<body>

<div class="header">
  <h1>🤖 Haxyy99 <span id="statusText">siap</span></h1>
</div>

<div class="tabs">
  <div class="tab active" data-tab="chat">💬 Chat</div>
  <div class="tab" data-tab="scan">📷 Scan</div>
  <div class="tab" data-tab="settings">⚙️ Setelan</div>
</div>

<div class="content active" id="tab-chat">
  <div class="chat" id="chat">
    <div class="msg ai">Halo! Aku Haxyy99. Tanya apa aja, atau pakai tab 📷 buat scan soal dari gambar.</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Tulis pertanyaan..." autocomplete="off">
    <button id="sendBtn">Kirim</button>
  </div>
</div>

<div class="content" id="tab-scan">
  <div class="scan-area">
    <div class="icon">📷</div>
    <p><b>Scan Soal dari Gambar</b><br>Foto soal pakai kamera atau pilih dari galeri, aku bakal baca & jawab.</p>
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;">
    <button class="btn-full" id="camBtn">📸 Buka Kamera / Galeri</button>
    <img id="preview" class="preview" alt="">
    <button class="btn-full" id="analyzeBtn" style="display:none;">🔍 Analisis Soal</button>
    <div id="ocrResult" style="font-size:12px;color:#8b949e;text-align:left;width:100%;margin-top:10px;"></div>
  </div>
</div>

<div class="content" id="tab-settings">
  <div class="settings">
    <div class="setting-group">
      <label>🔑 API Key (untuk jawaban pintar)</label>
      <input type="password" id="apiKey" placeholder="sk-... atau AIza...">
    </div>
    <div class="setting-group">
      <label>🌐 Provider</label>
      <select id="apiProvider">
        <option value="openai">OpenAI (GPT)</option>
        <option value="gemini">Google Gemini</option>
        <option value="local">Lokal (offline)</option>
      </select>
    </div>
    <div class="setting-group">
      <label>🎯 Bahasa</label>
      <select id="langSelect">
        <option value="id">Indonesia</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>
</div>

<div class="status">
  <span><span class="dot on" id="statusDot"></span><span id="statusMsg">siap</span></span>
</div>

<script>
var $ = function(id) { return document.getElementById(id); };
var chat = $('chat');
var userInput = $('userInput');

var kb = [
  { q: /halo|hai|hello/i, a: 'Halo! Ada yang bisa aku bantu?' },
  { q: /nama kamu|siapa kamu/i, a: 'Aku Haxyy99, AI auto jawab soal.' },
  { q: /(\d+)\s*\+\s*(\d+)/, a: function(m) { return m[1] + ' + ' + m[2] + ' = ' + (parseInt(m[1]) + parseInt(m[2])); } },
  { q: /(\d+)\s*-\s*(\d+)/, a: function(m) { return m[1] + ' - ' + m[2] + ' = ' + (parseInt(m[1]) - parseInt(m[2])); } },
  { q: /(\d+)\s*[x*]\s*(\d+)/, a: function(m) { return m[1] + ' × ' + m[2] + ' = ' + (parseInt(m[1]) * parseInt(m[2])); } },
  { q: /ibu kota indonesia/i, a: 'Jakarta.' },
  { q: /presiden indonesia/i, a: 'Prabowo Subianto.' },
  { q: /fotosintesis/i, a: 'Proses tumbuhan mengubah cahaya matahari, air, dan CO₂ menjadi glukosa + oksigen.' },
  { q: /proklamasi/i, a: 'Proklamasi 17 Agustus 1945 oleh Soekarno & Hatta.' }
];

function localAnswer(text) {
  for (var i = 0; i < kb.length; i++) {
    var m = text.match(kb[i].q);
    if (m) return typeof kb[i].a === 'function' ? kb[i].a(m) : kb[i].a;
  }
  return null;
}

function setStatus(msg, type) {
  type = type || 'on';
  $('statusMsg').textContent = msg;
  $('statusText').textContent = msg;
  $('statusDot').className = 'dot ' + type;
}

function addMsg(text, cls) {
  var div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function typeAnswer(text) {
  var div = addMsg('', 'ai typing');
  var i = 0;
  var timer = setInterval(function() {
    div.textContent = text.slice(0, i++);
    chat.scrollTop = chat.scrollHeight;
    if (i > text.length) { clearInterval(timer); div.classList.remove('typing'); }
  }, 15);
}

var tabs = document.querySelectorAll('.tab');
for (var t = 0; t < tabs.length; t++) {
  tabs[t].addEventListener('click', function() {
    var allTabs = document.querySelectorAll('.tab');
    var allContent = document.querySelectorAll('.content');
    for (var i = 0; i < allTabs.length; i++) allTabs[i].classList.remove('active');
    for (var i = 0; i < allContent.length; i++) allContent[i].classList.remove('active');
    this.classList.add('active');
    $('tab-' + this.getAttribute('data-tab')).classList.add('active');
  });
}

function askAI() {
  var q = userInput.value.trim();
  if (!q) return;
  addMsg(q, 'user');
  userInput.value = '';
  setStatus('berpikir...', 'rec');
  getAIAnswer(q).then(function(ans) {
    typeAnswer(ans);
    setStatus('siap', 'on');
  });
}
$('sendBtn').addEventListener('click', askAI);
userInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') askAI(); });

var fileInput = $('fileInput');
var preview = $('preview');
var analyzeBtn = $('analyzeBtn');

$('camBtn').addEventListener('click', function() { fileInput.click(); });

fileInput.addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    preview.src = ev.target.result;
    preview.style.display = 'block';
    analyzeBtn.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

analyzeBtn.addEventListener('click', function() {
  if (!preview.src) return;
  setStatus('memuat OCR...', 'rec');
  if (typeof Tesseract === 'undefined') {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = function() { runOCR(); };
    s.onerror = function() { setStatus('gagal load OCR', 'rec'); };
    document.head.appendChild(s);
  } else {
    runOCR();
  }
});

function runOCR() {
  Tesseract.recognize(preview.src, 'ind+eng', {
    logger: function(m) {
      if (m.status === 'recognizing text') {
        setStatus('OCR ' + Math.round(m.progress * 100) + '%', 'rec');
      }
    }
  }).then(function(result) {
    var text = result.data.text.trim();
    $('ocrResult').innerHTML = '<b>📖 Teks terbaca:</b><br>' + text;
    if (!text) { setStatus('teks kosong', 'rec'); return; }

    document.querySelector('.tab[data-tab="chat"]').click();
    addMsg('📷 [Scan]', 'user');
    addMsg(text, 'user');
    setStatus('menjawab...', 'rec');
    getAIAnswer(text).then(function(ans) {
      typeAnswer('💡 ' + ans);
      setStatus('siap', 'on');
    });
  }).catch(function(e) {
    setStatus('OCR gagal', 'rec');
    console.warn(e);
  });
}

function getAIAnswer(question) {
  return new Promise(function(resolve) {
    var provider = $('apiProvider').value;
    var apiKey = $('apiKey').value.trim();
    var lang = $('langSelect').value;
    var local = localAnswer(question);

    if (local && !apiKey) { resolve(local); return; }

    if (apiKey) {
      var p;
      if (provider === 'openai') p = callOpenAI(question, apiKey, lang);
      else if (provider === 'gemini') p = callGemini(question, apiKey, lang);
      else { resolve(local || 'Isi API key dulu.'); return; }

      p.then(function(ans) { resolve(ans); })
       .catch(function(e) { resolve(local || ('Gagal API: ' + e.message)); });
    } else {
      resolve(local || ('Soal: "' + question + '"\n\nIsi API Key di ⚙️ Setelan biar aku bisa jawab lebih pintar.'));
    }
  });
}

function callOpenAI(q, key, lang) {
  var sys = lang === 'id' ? 'Jawab dalam Bahasa Indonesia, singkat & jelas.' : 'Answer in English.';
  return fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({
      model: 'gpt-3.5-turbo',
      messages: [{ role: 'system', content: sys }, { role: 'user', content: q }],
      temperature: 0.5, max_tokens: 500
    })
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(d) { return d.choices[0].message.content.trim(); });
}

function callGemini(q, key, lang) {
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=' + key;
  var prompt = (lang === 'id' ? 'Jawab dalam Bahasa Indonesia: ' : '') + q;
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(d) { return d.candidates[0].content.parts[0].text.trim(); });
}

setStatus('siap', 'on');
</script>
</body>
                                                                                                               </html>
